<style>

<script>
/* ===== ENGINE (pure functions) ===== */
const UNITS = [
  {code:'U0', short:'ปฐมนิเทศ', title:'ปฐมนิเทศ แนวการสอน ข้อตกลง อธิบายงานกลุ่ม', hours:1, due:'X1', type:'orient'},
  {code:'C1', short:'Introduction', title:'บทที่ 1 ความรู้ทั่วไปเกี่ยวกับการใช้ข้อมูลบัญชีเพื่อการบริหาร', hours:6, due:'X1', type:'lecture'},
  {code:'A1', short:'แอป DrRachata ครั้งที่ 1', title:'แอป DrRachata ครั้งที่ 1: แนะนำแอปและโจทย์งานกลุ่ม', hours:1, due:'X1', type:'app'},
  {code:'C2', short:'Cost concepts and estimation', title:'บทที่ 2 พฤติกรรมต้นทุนและการประมาณต้นทุน', hours:8, due:'X1', type:'lecture'},
  {code:'C3', short:'Absorption and variable costing', title:'บทที่ 3 ระบบต้นทุนเต็มและระบบต้นทุนผันแปร', hours:4, due:'X1', type:'lecture'},
  {code:'C4', short:'Cost-volume-profit analysis', title:'บทที่ 4 การวิเคราะห์ต้นทุน ปริมาณ และกำไร', hours:6, due:'X2', type:'lecture'},
  {code:'A2', short:'แอป DrRachata ครั้งที่ 2', title:'แอป DrRachata ครั้งที่ 2: บันทึกต้นทุน จุดคุ้มทุน What-if', hours:2, due:'X2', type:'app'},
  {code:'C5', short:'Activity-based costing', title:'บทที่ 5 ระบบต้นทุนฐานกิจกรรม', hours:4, due:'X2', type:'lecture'},
  {code:'C6', short:'Profit planning and budgeting', title:'บทที่ 6 การวางแผนกำไรและงบประมาณ', hours:4, due:'X2', type:'lecture'},
  {code:'C7', short:'Flexible budgets and standard costs', title:'บทที่ 7 งบประมาณยืดหยุ่น ต้นทุนมาตรฐาน และการประเมินผลการดำเนินงาน', hours:4, due:'X2', type:'lecture'},
  {code:'C8', short:'Responsibility accounting', title:'บทที่ 8 การประเมินผลการปฏิบัติงานและการบัญชีตามความรับผิดชอบ', hours:4, due:'F', type:'lecture'},
  {code:'C9', short:'Pricing decisions', title:'บทที่ 9 การกำหนดราคาผลิตภัณฑ์', hours:2, due:'F', type:'lecture'},
  {code:'A3', short:'แอป DrRachata ครั้งที่ 3', title:'แอป DrRachata ครั้งที่ 3: ABC งบประมาณ ตั้งราคา Feasibility', hours:2, due:'F', type:'app'},
  {code:'C10', short:'Relevant information for decisions', title:'บทที่ 10 การใช้ข้อมูลทางการบัญชีเพื่อการตัดสินใจ', hours:4, due:'F', type:'lecture'},
  {code:'C11', short:'Capital budgeting', title:'บทที่ 11 การตัดสินใจรายจ่ายลงทุน', hours:4, due:'F', type:'lecture', cuttable:true},
];
const TEACH_TOTAL = 56;           // 64 h minus two exam weeks
const FLOOR_TOTAL = 52;           // at least 15 weeks of teaching (one week, 4 h, may be lost)
const MAX_CUT = 4;
const DAY_MS = 864e5;
const parseD = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
const fmtISO = t => new Date(t).toISOString().slice(0,10);
const addDays = (s, n) => fmtISO(parseD(s) + n*DAY_MS);
const weekdayOf = s => { const d = new Date(parseD(s)).getUTCDay(); return d === 0 ? 7 : d; }; // 1=Mon..7=Sun

function examWeeks(settings){ return {X1:+settings.x1Week||6, X2:+settings.x2Week||12}; }

function unitsFor(settings, cut){
  return UNITS.map(u => {
    const v = Object.assign({}, u);
    if (u.code === 'C7' && settings.ch7Due === 'F') v.due = 'F';
    const ov = (settings.hoursOverride||{})[u.code];
    if (ov != null && ov !== '') v.hours = +ov;
    if (u.cuttable) v.hours = Math.max(0, v.hours - (cut||0));
    return v;
  });
}

function buildSlots(settings, section){
  const ex = examWeeks(settings);
  const slots = [];
  for (let w = 1; w <= 16; w++){
    const monday = addDays(settings.startDate, 7*(w-1));
    const exam = w === ex.X1 ? 'X1' : w === ex.X2 ? 'X2' : null;
    for (const kind of ['L','P']){
      const day = kind === 'L' ? +section.lectureDay : +(section.practiceDay || section.lectureDay);
      slots.push({id:`w${w}${kind}`, week:w, kind, date:addDays(monday, day-1), hours:2, exam});
    }
  }
  return slots;
}

function holidayOn(settings, date){ return (settings.holidays||[]).find(h => h.date === date) || null; }

/* Status of one slot: taught | online | partial | cancelled | holiday | unlogged | planned | exam */
function slotStatus(slot, log, settings, today){
  if (slot.exam) return {status:'exam', hours:0};
  if (log && log.status){
    if (log.status === 'taught' || log.status === 'online') return {status:log.status, hours:2};
    if (log.status === 'partial') return {status:'partial', hours:Math.max(0, Math.min(2, +log.hours || 0))};
    if (log.status === 'cancelled') return {status:'cancelled', hours:0};
  }
  if (holidayOn(settings, slot.date)) return {status:'holiday', hours:0};
  if (slot.date < today) return {status:'unlogged', hours:2};
  return {status:'planned', hours:2};
}

/* Walk events in date order, consuming the unit sequence. */
function simulate(events, units){
  const queue = units.filter(u => u.hours > 0).map(u => ({code:u.code, left:u.hours}));
  const finish = {}, perEvent = {};
  let qi = 0;
  for (const ev of events){
    let h = ev.hours; const codes = [];
    while (h > 1e-9 && qi < queue.length){
      const q = queue[qi]; const take = Math.min(h, q.left);
      q.left -= take; h -= take; if (!codes.includes(q.code)) codes.push(q.code);
      if (q.left <= 1e-9){ finish[q.code] = ev.date; qi++; }
    }
    perEvent[ev.id] = codes;
  }
  return {finish, perEvent, leftover: queue.slice(qi).reduce((s,q)=>s+q.left,0)};
}

function analyse(state, sectionId, today){
  const settings = state.settings;
  const section = settings.sections.find(s => s.id === sectionId) || settings.sections[0];
  const sid = section.id;
  const logs = (state.logs||{})[sid] || {};
  const makeups = ((state.makeups||{})[sid] || []).slice();
  const cut = ((state.cuts||{})[sid]) || 0;
  const units = unitsFor(settings, cut);
  const slots = buildSlots(settings, section);
  const ex = examWeeks(settings);
  const examDate = k => slots.find(s => s.week === ex[k] && s.kind === 'L').date;
  const lastDate = slots.reduce((m,s)=> s.date > m ? s.date : m, slots[0].date);
  const cps = [
    {key:'X1', name:'สอบเก็บคะแนนครั้งที่ 1', date:examDate('X1'), week:ex.X1},
    {key:'X2', name:'สอบกลางภาค', date:examDate('X2'), week:ex.X2},
    {key:'F',  name:'ครบเนื้อหาสิ้นสัปดาห์ที่ 16', date:addDays(lastDate,1), week:16},
  ];
  const st = slots.map(s => Object.assign({}, s, slotStatus(s, logs[s.id], settings, today), {log:logs[s.id]||null}));
  const events = st.filter(s => !s.exam).map(s => ({id:s.id, date:s.date, hours:s.hours, ord:s.kind==='L'?0:1}))
    .concat(makeups.map(m => ({id:m.id, date:m.date, hours:+m.hours||0, ord:2})))
    .sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : a.ord - b.ord);
  const sim = simulate(events, units);

  // baseline: every non-exam slot taught, no makeups, full C11
  const baseUnits = unitsFor(settings, 0);
  const baseEvents = slots.filter(s=>!s.exam).map(s=>({id:s.id,date:s.date,hours:2}));
  const base = simulate(baseEvents, baseUnits);

  // checkpoints
  const cpRes = cps.map(cp => {
    const dueUnits = units.filter(u => cp.key === 'F' ? true : u.due === cp.key || (cp.key==='X2' && u.due==='X1'));
    const lastIdx = Math.max(...dueUnits.map(u => units.indexOf(u)));
    const required = units.slice(0, lastIdx+1).reduce((s,u)=>s+u.hours,0);
    const delivered = events.filter(e => e.date < cp.date).reduce((s,e)=>s+e.hours,0);
    const gap = Math.max(0, required - delivered);
    const replaceable = st.filter(s => (s.status==='cancelled'||s.status==='holiday') && s.date < cp.date);
    const online = replaceable.length * 2;
    const cutRoom = cp.key === 'F' ? Math.max(0, MAX_CUT - cut) : 0;
    const level = gap <= 1e-9 ? 'good' : gap <= online + cutRoom ? 'warn' : 'bad';
    const late = dueUnits.filter(u => u.hours>0 && (!sim.finish[u.code] || sim.finish[u.code] >= cp.date)).map(u=>u.code);
    return Object.assign({}, cp, {required, delivered, gap, online, cutRoom, level, replaceable, late, passed: today >= cp.date});
  });

  // SPI
  const pastSlots = st.filter(s => !s.exam && s.date < today);
  const PV = pastSlots.length * 2;
  const EV = pastSlots.reduce((s,x)=>s+x.hours,0) + makeups.filter(m=>m.date<today).reduce((s,m)=>s+(+m.hours||0),0);
  const spi = PV > 0 ? EV / PV : 1;
  const projected = events.filter(e => e.date <= lastDate).reduce((s,e)=>s+e.hours,0);
  const curWeek = Math.floor((parseD(today) - parseD(settings.startDate)) / DAY_MS / 7) + 1;
  return {section, slots:st, events, sim, base, cps:cpRes, PV, EV, spi, projected, cut, units, makeups, curWeek, today};
}

function suggestMakeupDate(a, cp, settings){
  // first weekday after today (and before the checkpoint) that is not a holiday and has no class
  const busy = new Set(a.slots.map(s=>s.date).concat(a.makeups.map(m=>m.date)));
  let d = addDays(a.today, 1);
  for (let i=0;i<60 && d < cp.date;i++, d = addDays(d,1)){
    const wd = weekdayOf(d);
    if (wd <= 5 && !holidayOn(settings,d) && !busy.has(d)) return d;
  }
  return null;
}

function isoToDmy(iso){ if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return ''; return `${iso.slice(8,10)}/${iso.slice(5,7)}/${+iso.slice(0,4)+543}`; }
function dmyToIso(v){
  const m = /^\s*(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\s*$/.exec(v||''); if (!m) return '';
  let d = +m[1], mo = +m[2], y = +m[3]; if (y > 2400) y -= 543;
  const t = Date.UTC(y, mo-1, d), dt = new Date(t);
  if (dt.getUTCFullYear()!==y || dt.getUTCMonth()!==mo-1 || dt.getUTCDate()!==d) return '';
  return dt.toISOString().slice(0,10);
}
function dVal(id){ const el = document.getElementById(id); return el ? dmyToIso(el.value) : ''; }
function dateField(attrs, iso, dis){

}

function setSave(msg){ document.getElementById('saveState').textContent = msg; }
function commit(note){
  if (note) state.history = [{at:new Date().toISOString(), section:curSec, note}].concat(state.history||[]).slice(0,200);
  render();
  if (!canWrite) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 500);
  setSave('กำลังบันทึก...');
}
async function save(){
  saveTimer = null;
  const body = JSON.stringify(state);
  if (body === lastSaved) { setSave('บันทึกแล้ว'); return; }
  if (saving){ saveTimer = setTimeout(save, 400); return; }
  saving = true;
  try{
    if (dbRef){ await dbRef.set(JSON.parse(body)); }
    else { try{ localStorage.setItem('mtt-state', body); }catch(e){} }
    lastSaved = body; setSave(dbRef ? 'บันทึกแล้ว' : 'บันทึกในเบราว์เซอร์นี้');
  }catch(e){
    if (e && e.code === 'invalid_argument'){ canWrite = false; setSave('ดูได้อย่างเดียว'); render(); }
    else setSave('บันทึกไม่สำเร็จ ลองอีกครั้ง');
  }finally{ saving = false; }
}

function alertsFor(a){
  const out = [];
  const unl = a.slots.filter(s => s.status === 'unlogged');
  if (unl.length) out.push({tone:'warn', html:`<b>ยังไม่บันทึก ${unl.length} คาบที่ผ่านมาแล้ว</b> ระบบถือว่าสอนตามแผนไปก่อน <button class="btn small" data-go="timeline">บันทึกเลย</button>`});
  const soon = a.slots.filter(s => s.status === 'holiday' && s.date >= a.today && parseD(s.date) - parseD(a.today) <= 14*DAY_MS);
  soon.filter((s,i)=>soon.findIndex(x=>x.date===s.date)===i).forEach(s => out.push({tone:'bad', html:`<b>${thDate(s.date,true)} ตรงวันหยุด</b> (${esc(holidayOn(state.settings,s.date).title)}) คาบสอนสัปดาห์ที่ ${s.week} วันนั้นจะงด`}));
  const gd = state.settings.gradeDue;
  if (gd){ const n = Math.round((parseD(gd) - parseD(a.today))/DAY_MS);
    if (n >= 0) out.push({tone: n <= 14 ? 'bad' : 'info', html:`<b>กำหนดส่งเกรด ${thDateY(gd)}</b> ${n===0?'วันนี้':`อีก ${n} วัน`}`});
  } else out.push({tone:'info', html:`ยังไม่ได้ใส่กำหนดส่งเกรดของภาคเรียนนี้ <button class="btn small" data-go="settings">ใส่วันที่</button>`});
  const later = a.slots.filter(s => s.status === 'holiday' && parseD(s.date) - parseD(a.today) > 14*DAY_MS);
  if (later.length) out.push({tone:'info', html:`มีคาบที่ตรงวันหยุดล่วงหน้าอีก ${later.length} คาบ: ${[...new Set(later.map(s=>s.date))].map(d=>thDate(d,true)).join(', ')}`});
  a.cps.forEach(cp => {
    const days = (parseD(cp.date) - parseD(a.today)) / DAY_MS;
    if (!cp.passed && cp.level !== 'good') out.push({tone: cp.level==='bad'?'bad':'warn', html:`<b>${esc(cp.name)} (${thDate(cp.date,true)}):</b> เนื้อหาขาด ${fmtH(cp.gap)} ชม. ${days<=7?'<b>เหลือไม่ถึง 7 วัน</b> ':''}<button class="btn small" data-go="catchup">ดูแผนชดเชย</button>`});
  });
  ['A1','A2','A3'].forEach(c => {
    const s = a.slots.find(x => (a.base.perEvent[x.id]||[]).includes(c));
    if (s && (s.status==='holiday'||s.status==='cancelled')) out.push({tone:'warn', html:`<b>คาบแอป ${c}</b> ตามแผนอยู่ ${thDate(s.date,true)} ซึ่งงดสอน ระบบเลื่อนไปคาบถัดไปให้แล้ว ควรเป็นคาบในห้องเพราะต้องฝึกปฏิบัติ`});
  });
  if (a.projected < FLOOR_TOTAL) out.push({tone:'bad', html:`<b>ชั่วโมงสอนรวมคาดการณ์ ${fmtH(a.projected)} ชม.</b> ต่ำกว่าเกณฑ์ 15 สัปดาห์ (${FLOOR_TOTAL} ชม.)`});
  return out;
}

function chapProgress(a){
  const chaps = a.units.filter(u => u.type === 'lecture');
  const pastIds = new Set(a.events.filter(e => e.date < a.today).map(e => e.id));
  const started = new Set(); Object.keys(a.sim.perEvent).forEach(id => { if (pastIds.has(id)) a.sim.perEvent[id].forEach(c => started.add(c)); });
  const st = u => u.hours <= 0 ? 'cut' : (a.sim.finish[u.code] && a.sim.finish[u.code] < a.today) ? 'done' : started.has(u.code) ? 'doing' : 'todo';
  const done = chaps.filter(u => st(u) === 'done'), doing = chaps.filter(u => st(u) === 'doing');
  const total = chaps.filter(u => u.hours > 0).length;
  return `<p style="margin:10px 0 2px"><b>สอนจบแล้ว ${done.length} จาก ${total} บท:</b> ${done.length ? done.map(u => esc(labelOf(u.code))).join(', ') : 'ยังไม่มี'}</p>
    ${doing.length ? `<p class="small" style="margin:0">กำลังสอน: ${doing.map(u => esc(labelOf(u.code))).join(', ')}</p>` : ''}
    <div class="chaps" aria-label="สถานะรายบท">${chaps.map(u => `<span class="chap ${st(u)}" title="${esc(u.title)}">${esc(labelOf(u.code))}</span>`).join('')}</div>
    <p class="small muted" style="margin-top:8px">สีเข้ม = สอนจบแล้ว · กรอบสี = กำลังสอน · สีจาง = ยังไม่ถึง</p>`;
}

function vOverview(a){
  const spiTone = a.spi >= state.settings.spiYellow ? 'good' : a.spi >= state.settings.spiRed ? 'warn' : 'bad';
  const doneUnits = Object.keys(a.sim.finish).filter(c => a.sim.finish[c] < a.today);
  const pct = Math.min(100, a.EV / TEACH_TOTAL * 100);
  const planPct = Math.min(100, a.PV / TEACH_TOTAL * 100);
  const al = alertsFor(a);
  const next = a.slots.find(s => s.date >= a.today && !s.exam);
  return `
  <section class="grid g4">
    <div class="stat"><span class="lbl">สัปดาห์ปัจจุบัน</span><span class="val">${a.curWeek<1?'–':Math.min(a.curWeek,17)}<span class="small muted"> / 16</span></span><span class="sub">วันนี้ ${thDateY(a.today)}</span></div>
    <div class="stat"><span class="lbl">ดัชนีความก้าวหน้า SPI</span><span class="val">${a.PV?a.spi.toFixed(2):'–'}</span><span class="sub">${pill(spiTone, spiTone==='good'?'ตามแผน':spiTone==='warn'?'ล่าช้าเล็กน้อย':'ล่าช้ามาก')} สอนแล้ว ${fmtH(a.EV)} จากแผน ${fmtH(a.PV)} ชม.</span></div>
    <div class="stat"><span class="lbl">ชั่วโมงสอนรวมคาดการณ์</span><span class="val">${fmtH(a.projected)}<span class="small muted"> / ${TEACH_TOTAL}</span></span><span class="sub">ขั้นต่ำ ${FLOOR_TOTAL} ชม. (15 สัปดาห์) ${a.cut?`· ตัดบทที่ 11 แล้ว ${fmtH(a.cut)} ชม.`:''}</span></div>
    <div class="stat"><span class="lbl">คาบถัดไป</span><span class="val" style="font-size:1.1rem;font-family:var(--f-display)">${next?thDate(next.date,true):'–'}</span><span class="sub">${next?`สัปดาห์ ${next.week} · ${next.kind==='L'?'บรรยาย':'ปฏิบัติ'} · `:''}${next?codesHTML(a.sim.perEvent[next.id]):''}</span></div>
  </section>
  <section class="panel">
    <div class="formrow" style="justify-content:space-between"><h2>ความคืบหน้าเนื้อหา</h2><span class="small muted">เส้นดำ = ควรถึงตามแผน ณ วันนี้</span></div>

function slotCell(a, s){
  const baseCodes = a.base.perEvent[s.id] || [];
  if (s.exam) return `<div class="slot">${pill('acc', s.exam==='X1'?'สอบครั้งที่ 1':'สอบกลางภาค')}</div>`;
  const log = s.log || {};
  const val = log.status || '';
  const dis = canWrite ? '' : 'disabled';
  return `<div class="slot">
    <div class="row">${pill(STATUS_TONE[s.status], STATUS_LABEL[s.status])}</div>
    <div class="row">
      <select aria-label="สถานะคาบ ${esc(s.id)}" data-slot="${s.id}" data-f="status" ${dis}>
        <option value="" ${!val?'selected':''}>– บันทึก –</option>
        <option value="taught" ${val==='taught'?'selected':''}>สอนครบ</option>
        <option value="partial" ${val==='partial'?'selected':''}>สอนบางส่วน</option>
        <option value="online" ${val==='online'?'selected':''}>สอนออนไลน์แทน</option>
        <option value="cancelled" ${val==='cancelled'?'selected':''}>งดสอน</option>
      </select>
      ${val==='partial'?`<input type="number" min="0" max="2" step="0.5" value="${esc(log.hours||1)}" style="width:64px" aria-label="ชั่วโมงที่สอน" data-slot="${s.id}" data-f="hours" ${dis}><span class="small muted">ชม.</span>`:''}
      ${val==='cancelled'||val==='online'||val==='partial'?`<select aria-label="เหตุผล" data-slot="${s.id}" data-f="reason" ${dis}><option value="">เหตุผล...</option>${REASONS.map(r=>`<option ${log.reason===r?'selected':''}>${r}</option>`).join('')}</select>`:''}
    </div>
    ${codesHTML(a.sim.perEvent[s.id], baseCodes)}
  </div>`;
}

function vTimeline(a){
  const rows = [];
  for (let w=1; w<=16; w++){
    const L = a.slots.find(s=>s.week===w&&s.kind==='L'), P = a.slots.find(s=>s.week===w&&s.kind==='P');
    const mk = a.makeups.filter(m => { const wk = Math.floor((parseD(m.date)-parseD(state.settings.startDate))/DAY_MS/7)+1; return wk===w; });
    const base = [...new Set([...(a.base.perEvent[L.id]||[]), ...(a.base.perEvent[P.id]||[])])];
    rows.push(`<tr class="${a.curWeek===w?'now':''} ${L.exam?'exam':''}">
      <td class="num">${w}</td>
      <td>${thDate(L.date,true)}${P.date!==L.date?`<br>${thDate(P.date,true)}`:''}</td>
      <td>${L.exam?pill('acc','สอบ'):codesHTML(base)}</td>
      <td>${slotCell(a,L)}</td>
      <td>${L.exam?'':slotCell(a,P)}</td>
      <td>${mk.map(m=>`<div class="slot"><div class="row">${pill(m.mode==='online'?'info':'good', (m.mode==='online'?'ออนไลน์ ':'ชดเชย ')+thDate(m.date,true)+' · '+fmtH(+m.hours)+' ชม.')}${canWrite?`<button class="btn small" data-delmk="${esc(m.id)}" aria-label="ลบ">ลบ</button>`:''}</div>${codesHTML(a.sim.perEvent[m.id])}</div>`).join('')}</td>
    </tr>`);
  }
  return `<section class="panel">
    <div class="formrow" style="justify-content:space-between"><h2>ไทม์ไลน์และบันทึกการสอน · ${esc(a.section.name)}</h2>
    <div class="legend small">${pill('neutral','รหัส = หน่วยเนื้อหา')} <span class="code app">A</span><span class="muted">คาบแอป</span> <span class="code moved">C</span><span class="muted">เลื่อนจากแผนเดิม</span></div></div>
    <p class="small muted">เลือกสถานะของแต่ละคาบหลังสอนเสร็จ ระบบเลื่อนเนื้อหาที่ค้างไปคาบถัดไปตามลำดับให้อัตโนมัติ คอลัมน์ "แผนเดิม" คือ baseline ที่ใช้เทียบ</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="num">สัปดาห์</th><th>วันที่</th><th>แผนเดิม</th><th>คาบบรรยาย (2 ชม.)</th><th>คาบปฏิบัติ (2 ชม.)</th><th>คาบชดเชย / ออนไลน์เพิ่ม</th></tr></thead>
      <tbody>${rows.join('')}
      <tr><td class="num">17</td><td colspan="5">สอบปลายภาค ตามตารางสอบของคณะ${state.settings.gradeDue?` · ส่งเกรดภายใน ${thDateY(state.settings.gradeDue)}`:''}</td></tr></tbody>
    </table></div>
  </section>`;
}

function vCatchup(a){

  const openAll = a.cps.filter(cp => !cp.passed && cp.gap > 0);
  const open = openAll.slice(0,1);
  const blocks = open.map(cp => {
    const sug = suggestMakeupDate(a, cp, settings);
    const mkH = Math.min(cp.gap, settings.maxMakeupPerWeek||3);
    const onlineCover = Math.min(cp.gap, cp.online);
    const recO = cp.online >= cp.gap;
    const opts = [];
    opts.push(`<div class="opt ${recO?'rec':''}">
      <h4>O · สอนออนไลน์แทนคาบที่งด ${recO?pill('acc','แนะนำ'):''}</h4>
      <p class="small">คาบที่งดก่อน${esc(cp.name)}: ${cp.replaceable.length?cp.replaceable.map(s=>thDate(s.date,true)+(s.kind==='L'?' (บรรยาย)':' (ปฏิบัติ)')).join(', '):'ไม่มี'}</p>
      <p class="small muted">ปิดได้ ${fmtH(onlineCover)} จาก ${fmtH(cp.gap)} ชม. ตารางไม่เปลี่ยน</p>
      ${cp.replaceable.length && canWrite?`<div class="formrow">${cp.replaceable.map(s=>`<button class="btn small primary" data-online="${s.id}">ออนไลน์แทน ${thDate(s.date)}</button>`).join('')}</div>`:''}
    </div>`);
    opts.push(`<div class="opt ${!recO&&cp.key!=='F'?'rec':''}">
      <h4>A · เพิ่มคาบชดเชย ${!recO&&cp.key!=='F'?pill('acc','แนะนำ'):''}</h4>
      <p class="small">ต้องการอีก ${fmtH(cp.gap)} ชม. ก่อน ${thDate(cp.date,true)} (ไม่เกิน ${settings.maxMakeupPerWeek} ชม./สัปดาห์)</p>
      ${canWrite?`<div class="formrow">${dateField(`id="mkd-${cp.key}" aria-label="วันที่ชดเชย"`, sug||'')}<input type="number" id="mkh-${cp.key}" min="0.5" max="4" step="0.5" value="${mkH}" style="width:70px" aria-label="ชั่วโมง">
      <select id="mkm-${cp.key}" aria-label="รูปแบบ"><option value="class">ในห้อง</option><option value="online">ออนไลน์</option></select>
      <button class="btn small primary" data-addmk="${cp.key}">เพิ่มคาบ</button></div>`:''}
      ${sug?'':'<p class="small muted">ไม่พบวันว่างในวันทำการก่อนจุดตรวจสอบ ลองเลือกวันเสาร์</p>'}
    </div>`);
    if (cp.key === 'F') opts.push(`<div class="opt ${!recO?'rec':''}">
      <h4>B · ตัดเนื้อหาบทที่ 11 ${!recO?pill('acc','ใช้เมื่อจำเป็น'):''}</h4>
      <p class="small">ตัดได้อีก ${fmtH(cp.cutRoom)} ชม. (ตัดแล้ว ${fmtH(a.cut)} ชม.) ชั่วโมงสอนรวมต้องไม่ต่ำกว่า ${FLOOR_TOTAL} ชม.</p>
      ${canWrite && cp.cutRoom>0?`<button class="btn small" data-cut="${Math.min(cp.gap,cp.cutRoom)}">ตัด ${fmtH(Math.min(cp.gap,cp.cutRoom))} ชม.</button>`:''}
    </div>`);
    else opts.push(`<div class="opt">
      <h4>D · เลื่อนสอบไปสัปดาห์ถัดไป</h4>
      <p class="small">ปิดช่องว่างได้ แต่เนื้อหาหลังสอบจะเลื่อนตามและอาจไปขาดที่จุดตรวจสอบถัดไป ไม่แนะนำ</p>
      ${canWrite?`<button class="btn small" data-movex="${cp.key}">เลื่อน${esc(cp.name)}เป็นสัปดาห์ ${cp.week+1}</button>`:''}
    </div>`);
    return `<section class="panel">
      <div class="formrow" style="justify-content:space-between"><h2>${esc(cp.name)} · ${thDate(cp.date,true)}</h2>${pill(cp.level, LEVEL_LABEL[cp.level])}</div>
      <p>ต้องสอนให้ถึง ${fmtH(cp.required)} ชม. ก่อนจุดนี้ แต่ตามตารางปัจจุบันจะสอนได้ ${fmtH(cp.delivered)} ชม. <b>ขาด ${fmtH(cp.gap)} ชม.</b> หน่วยที่ยังไม่ทัน: ${cp.late.join(', ')||'–'}</p>
      <div class="opts">${opts.join('')}</div>
      ${openAll.length>1?`<p class="small muted">จุดตรวจสอบถัดไปที่ได้รับผลกระทบด้วย: ${openAll.slice(1).map(c=>esc(c.name)+' (ขาด '+fmtH(c.gap)+' ชม.)').join(', ')} ส่วนใหญ่จะหายเองเมื่อปิดช่องว่างที่จุดนี้</p>`:''}
    </section>`;
  });
  return `${blocks.join('') || `<section class="panel"><h2>ไม่มีช่องว่างที่ต้องชดเชย</h2><p class="muted">ทุกจุดตรวจสอบที่ยังมาไม่ถึงสอนได้ครบตามตารางปัจจุบัน เมื่อบันทึกคาบงด ระบบจะเสนอทางเลือกที่นี่</p></section>`}
  <section class="panel">
    <h2>ข้อความประกาศถึงนักศึกษา</h2>
    <p class="small muted">สร้างจากคาบงด คาบออนไลน์ และคาบชดเชยของกลุ่มนี้ แก้ไขได้ก่อนคัดลอกไปโพสต์ใน Google Classroom หรือกลุ่ม Facebook</p>
    <textarea id="notice" aria-label="ข้อความประกาศ">${esc(noticeText(a))}</textarea>
    <div class="formrow"><button class="btn primary" id="copyNotice">คัดลอกข้อความ</button><span id="copyMsg" class="small muted"></span></div>
  </section>
  <section class="panel">
    <h2>ประวัติการเปลี่ยนแผน</h2>
    ${(state.history||[]).filter(h=>h.section===curSec).length ? `<div class="tbl-wrap"><table><thead><tr><th>เวลา</th><th>การเปลี่ยนแปลง</th></tr></thead><tbody>${(state.history||[]).filter(h=>h.section===curSec).slice(0,40).map(h=>`<tr><td style="white-space:nowrap">${esc(new Date(h.at).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short',timeZone:'Asia/Bangkok'}))}</td><td>${esc(h.note)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">ยังไม่มีการเปลี่ยนแผน</p>'}
  </section>`;
}

function noticeText(a){
  const lines = [];
  const changed = a.slots.filter(s => s.date >= addDays(a.today,-14) && ['cancelled','holiday','online'].includes(s.status));
  const mks = a.makeups.filter(m => m.date >= a.today);
  if (!changed.length && !mks.length) return `แจ้งนักศึกษารายวิชา${state.settings.courseName} (${state.settings.courseCode}) ${a.section.name}\nตารางเรียนเป็นไปตามแผนการสอน ไม่มีการเปลี่ยนแปลงในช่วงนี้`;
  lines.push(`แจ้งนักศึกษารายวิชา${state.settings.courseName} (${state.settings.courseCode}) ${a.section.name}`);
  changed.forEach(s => {
    const what = (a.base.perEvent[s.id]||[]).map(c=>unitByCode(c).title.replace(/^บทที่ (\d+) .*/, 'บทที่ $1')).join(', ');
    if (s.status==='online') lines.push(`- ${thDateY(s.date)} คาบ${s.kind==='L'?'บรรยาย':'ปฏิบัติ'} เรียนออนไลน์แทนการเรียนในห้อง (${what}) ดูคลิปและส่งแบบฝึกหัดใน Google Classroom`);
    else lines.push(`- ${thDateY(s.date)} งดเรียนคาบ${s.kind==='L'?'บรรยาย':'ปฏิบัติ'}${s.status==='holiday'?' (วันหยุด)':s.log&&s.log.reason?` (${s.log.reason})`:''}`);
  });
  mks.forEach(m => lines.push(`- ${thDateY(m.date)} ${m.mode==='online'?'เรียนออนไลน์เพิ่ม':'เรียนชดเชยในห้อง'} ${fmtH(+m.hours)} ชม. หัวข้อ: ${(a.sim.perEvent[m.id]||[]).join(', ')||'ตามที่แจ้ง'}`));
  lines.push('เนื้อหาทั้งหมดยังครบตามแนวการสอน และสอบตามกำหนดเดิม');
  return lines.join('\n');
}

  A2:['บันทึกต้นทุนจริงของธุรกิจกลุ่ม','แยก FC / VC / MC และแยกต้นทุนผสม','อ่านจุดคุ้มทุน (หน่วย/บาท) และ MOS','ยอดขายเพื่อกำไรเป้าหมาย','What-if อย่างน้อย 3 สถานการณ์','ส่งไฟล์ส่งออกจากแอปเข้า Google Classroom'],
  A3:['ต้นทุนฐานกิจกรรม (ABC)','งบประมาณ','การตั้งราคา','กำไรส่วนงาน','Feasibility: NPV, IRR, Payback','ตรวจความสมเหตุสมผลของตัวเลขก่อนใส่รายงาน'],
};
function vApp(a){
  const groups = state.groups || [];

  if (gFilter && !rooms.includes(gFilter)) gFilter = '';
  const shown = groups.map((g,i)=>({g,i})).filter(x => !gFilter || x.g.room === gFilter)
    .sort((x,y) => (rooms.indexOf(x.g.room)+1||99) - (rooms.indexOf(y.g.room)+1||99) || x.i - y.i);
  const sessions = ['A1','A2','A3'].map(c => {
    const u = unitByCode(c);
    const slotId = Object.keys(a.sim.perEvent).find(k => a.sim.perEvent[k].includes(c));
    const ev = a.events.find(e => e.id === slotId);
    const baseId = Object.keys(a.base.perEvent).find(k => a.base.perEvent[k].includes(c));
    const baseSlot = a.slots.find(s=>s.id===baseId);
    const moved = ev && baseSlot && ev.date !== baseSlot.date;
    const done = (state.appDone||{})[curSec+':'+c] || {};
    return `<div class="panel">
      <div class="formrow" style="justify-content:space-between"><h3>${esc(u.title)}</h3>${pill(moved?'warn':'acc', ev?`${thDate(ev.date,true)} · ${u.hours} ชม.`:'ยังไม่มีคาบ')}</div>
      ${moved?`<p class="small">เลื่อนจากแผนเดิม ${thDate(baseSlot.date,true)}</p>`:''}
      <div class="list">${APP_MODULES[c].map((t,i)=>`<label class="chk small"><input type="checkbox" data-mod="${c}:${i}" ${done[i]?'checked':''} ${canWrite?'':'disabled'}><span>${esc(t)}</span></label>`).join('')}</div>
    </div>`;
  }).join('');
  return `<section class="panel">
    <div class="formrow" style="justify-content:space-between"><h2>แอป DrRachata: MA information for SMEs</h2>
    ${state.settings.appUrl && /^https:\/\//.test(state.settings.appUrl) ? `<a class="btn small primary" href="${esc(state.settings.appUrl)}" target="_blank" rel="noopener">เปิดแอป</a>` : '<span class="small muted">ใส่ลิงก์แอปได้ที่หน้าตั้งค่า</span>'}</div>
    <p class="small muted">คาบแอปใช้ชั่วโมงปฏิบัติ สอนออนไลน์แทนได้แต่ไม่แนะนำ เพราะนักศึกษาต้องลงมือกับข้อมูลธุรกิจของกลุ่ม ติ๊กหัวข้อที่สาธิตแล้วในแต่ละครั้ง (แยกตามกลุ่มเรียน)</p>
  </section>
  <section class="grid g3">${sessions}</section>
  <section class="panel">

    <p class="small muted">บันทึกกลุ่มที่มาปรึกษาพร้อมห้องเรียนและกลุ่มสินค้า/ธุรกิจ เพื่อจำได้ว่านักศึกษาอยู่ห้องไหน ${rooms.length?'ห้องเรียน: '+rooms.map(r=>`${esc(r)} (${groups.filter(g=>g.room===r).length})`).join(' · '):''}</p>

      <button class="btn small primary" id="gAdd">เพิ่มกลุ่ม</button></div>`:''}

/* ---- events ---- */
document.querySelector('.brand h1').addEventListener('click', () => { tab = 'cover'; render(); window.scrollTo(0,0); });
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab; try{localStorage.setItem('mtt-tab',tab)}catch(err){} render();
});
document.getElementById('secSel').addEventListener('change', e => { curSec = e.target.value; try{localStorage.setItem('mtt-sec',curSec)}catch(err){} render(); });

const main = document.getElementById('main');
main.addEventListener('click', async e => {
  const t = e.target.closest('button, a'); if (!t) return;
  const d = t.dataset;
  if (d.go){ tab = d.go; try{localStorage.setItem('mtt-tab',tab)}catch(err){} render(); window.scrollTo(0,0); return; }
  if (!canWrite) return;
  if (d.online){ setLog(d.online, {status:'online', reason:(getLog(d.online)||{}).reason || (holidayOn(state.settings, analyse(state,curSec,today).slots.find(s=>s.id===d.online).date)?'วันหยุด':'')}); commit(`ตั้งคาบ ${d.online} เป็นสอนออนไลน์แทน`); return; }
  if (d.addmk){
    const date = dVal('mkd-'+d.addmk), h = +document.getElementById('mkh-'+d.addmk).value, mode = document.getElementById('mkm-'+d.addmk).value;
    if (!date || !(h>0)) return;
    state.makeups[curSec] = (state.makeups[curSec]||[]).concat({id:'mk'+Date.now().toString(36), date, hours:h, mode});
    commit(`เพิ่มคาบ${mode==='online'?'ออนไลน์':'ชดเชย'} ${thDateY(date)} ${fmtH(h)} ชม.`); return;
  }
  if (d.delmk){ state.makeups[curSec] = (state.makeups[curSec]||[]).filter(m=>m.id!==d.delmk); commit('ลบคาบชดเชย'); return; }
  if (d.cut){ state.cuts[curSec] = Math.min(MAX_CUT, (state.cuts[curSec]||0) + (+d.cut)); commit(`ตัดเนื้อหาบทที่ 11 ${fmtH(+d.cut)} ชม.`); return; }
  if (d.movex){ const k = d.movex==='X1'?'x1Week':'x2Week'; state.settings[k] = +state.settings[k] + 1; commit(`เลื่อน${d.movex==='X1'?'สอบครั้งที่ 1':'สอบกลางภาค'}ไปสัปดาห์ ${state.settings[k]} (ทุกกลุ่มเรียน)`); return; }
  if (t.id === 'copyNotice'){
    const txt = document.getElementById('notice').value; const msg = document.getElementById('copyMsg');
    try{ await navigator.clipboard.writeText(txt); msg.textContent = 'คัดลอกแล้ว'; }catch(err){ const ta = document.getElementById('notice'); ta.focus(); ta.select(); msg.textContent = 'กด Ctrl+C / ⌘C เพื่อคัดลอก'; }
    return;
  }
  if (t.id === 'gAdd'){ const n = document.getElementById('gName').value.trim(); if (!n) return; state.groups = (state.groups||[]).concat({name:n, sec:curSec, room:document.getElementById('gRoom').value, biz:document.getElementById('gBiz').value.trim(), met:today}); commit(`เพิ่มกลุ่มงาน ${n}`); return; }
  if (d.delg){ state.groups.splice(+d.delg,1); commit(); return; }
  if (t.id === 'addSec'){ const n = state.settings.sections.length+1; state.settings.sections.push({id:'s'+Date.now().toString(36), name:'กลุ่ม '+n, lectureDay:3, practiceDay:3, time:''}); commit(); return; }
  if (d.delsec){ const x = state.settings.sections.splice(+d.delsec,1)[0]; if (x && curSec===x.id) curSec = state.settings.sections[0].id; commit(`ลบกลุ่มเรียน ${x?x.name:''}`); return; }
  if (t.id === 'confirmCfg'){ state.settings.configured = true; tab = 'overview'; try{localStorage.setItem('mtt-tab',tab)}catch(err){} commit('ยืนยันวันเรียนของกลุ่มเรียน'); window.scrollTo(0,0); return; }
  if (t.id === 'newTerm'){ const term = document.getElementById('nTerm').value.trim(), start = dVal('nStart'), grade = dVal('nGrade'); if (!term || !start) { setSave('กรอกภาคเรียนใหม่และวันเปิดภาค (dd/mm/yyyy)'); return; } pendingNewTerm = {term, start, grade}; render(); return; }
  if (t.id === 'newTermCancel'){ pendingNewTerm = null; render(); return; }
  if (t.id === 'newTermGo' && pendingNewTerm){
    const old = JSON.parse(JSON.stringify(state)); const key = String(old.settings.termLabel||'term').replace(/[^A-Za-z0-9_-]/g,'-') + '-' + Date.now().toString(36);
    try{ if (dbApi) await dbApi.doc('archive/'+key).set({term:old.settings.termLabel, savedAt:new Date().toISOString(), state:JSON.stringify(old)}); else localStorage.setItem('mtt-archive-'+key, JSON.stringify(old)); }
    catch(err){ if (dbApi){ setSave('เก็บสำเนาไม่สำเร็จ ยังไม่ได้ล้างข้อมูล'); return; } }
    const oldTerm = old.settings.termLabel;
    state.archives = (state.archives||[]).concat({term:oldTerm, key});
    state.settings.termLabel = pendingNewTerm.term; state.settings.startDate = pendingNewTerm.start; state.settings.gradeDue = pendingNewTerm.grade || '';
    state.settings.holidays = []; state.settings.configured = false; state.settings.x1Week = 6; state.settings.x2Week = 12;
    state.logs = {}; state.makeups = {}; state.cuts = {}; state.appDone = {}; state.groups = []; state.history = [];
    pendingNewTerm = null; commit(`เริ่มภาคเรียน ${state.settings.termLabel} (เก็บสำเนา ${oldTerm})`); return;
  }
  if (t.id === 'hAdd'){ const dt = dVal('hDate'), ti = document.getElementById('hTitle').value.trim(); if (!dt) return; state.settings.holidays = (state.settings.holidays||[]).filter(h=>h.date!==dt).concat({date:dt, title:ti||'งดสอน'}); commit(`เพิ่มวันหยุด/กิจกรรม ${thDateY(dt)}`); return; }
  if (d.delhol){ state.settings.holidays = state.settings.holidays.filter(h=>h.date!==d.delhol); commit(`ลบวันหยุด ${thDateY(d.delhol)}`); return; }
});
main.addEventListener('change', e => {
  const t = e.target; const d = t.dataset;
  if (t.id === 'gFilter'){ gFilter = t.value; render(); return; }
  if (t.classList.contains('dmyp')){ const txt = t.closest('.dmyw').querySelector('.dmy'); txt.value = isoToDmy(t.value); txt.dispatchEvent(new Event('change', {bubbles:true})); return; }
  if (t.classList.contains('dmy')){
    const iso = dmyToIso(t.value);
    if (t.value.trim() && !iso){ t.classList.add('bad'); t.title = 'รูปแบบวันที่ dd/mm/yyyy เช่น 09/11/2569'; return; }
    t.classList.remove('bad'); t.title = ''; if (iso) t.value = isoToDmy(iso);
    const pk = t.closest('.dmyw').querySelector('.dmyp'); if (pk) pk.value = iso;
    if (!canWrite) return;
    if (d.grpf){ const [i,k] = d.grpf.split(':'); state.groups[+i][k] = iso; commit(); return; }
    if (t.id === 'sStart'){ if (!iso) return; state.settings.startDate = iso; commit('ตั้งวันเปิดภาค'); return; }
    if (t.id === 'sGrade'){ state.settings.gradeDue = iso; commit(iso?`ตั้งกำหนดส่งเกรด ${thDateY(iso)}`:'ล้างกำหนดส่งเกรด'); return; }
    return;
  }
  if (!canWrite) return;
  if (d.slot){
    if (d.f === 'status'){ setLog(d.slot, {status:t.value, hours: t.value==='partial'?1:undefined}); commit(t.value?`บันทึกคาบ ${d.slot}: ${STATUS_LABEL[t.value]}`:`ล้างบันทึกคาบ ${d.slot}`); }
    else if (d.f === 'hours'){ setLog(d.slot, {hours:+t.value}); commit(); }
    else if (d.f === 'reason'){ setLog(d.slot, {reason:t.value}); commit(); }
    return;
  }
  if (d.mod){ const [c,i] = d.mod.split(':'); state.appDone = state.appDone||{}; const k = curSec+':'+c; state.appDone[k] = Object.assign({}, state.appDone[k]||{}, {[i]:t.checked}); commit(); return; }
  if (t.id === 'gFilter'){ gFilter = t.value; render(); return; }
  if (d.grpf){ const [i,k] = d.grpf.split(':'); state.groups[+i][k] = k==='biz' ? t.value.trim() : t.value; commit(); return; }
  if (d.grp){ const [i,k] = d.grp.split(':'); state.groups[+i][k] = t.checked; commit(); return; }
  if (d.uname){ state.settings.unitNames = Object.assign({}, state.settings.unitNames, {[d.uname]: t.value.trim()}); commit(); return; }
  if (d.hrs){ state.settings.hoursOverride = Object.assign({}, state.settings.hoursOverride, {[d.hrs]: t.value}); commit(`แก้ชั่วโมง ${d.hrs} เป็น ${t.value}`); return; }
  if (d.sec){ const [i,f] = d.sec.split(':'); state.settings.sections[+i][f] = (f==='lectureDay'||f==='practiceDay') ? +t.value : t.value; commit(); return; }
  if (t.id === 'sRooms'){ state.settings.classrooms = t.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean); commit('แก้รายชื่อห้องเรียน'); return; }
  const map = {sTerm:'termLabel', sCode:'courseCode', sName:'courseName', sInst:'instructor', sUni:'university', sProg:'program', sX1:'x1Week', sX2:'x2Week', sCh7:'ch7Due', sMax:'maxMakeupPerWeek', sApp:'appUrl'};
  if (map[t.id]){ const f = map[t.id]; state.settings[f] = ['x1Week','x2Week','maxMakeupPerWeek'].includes(f) ? +t.value : t.value; commit(`ตั้งค่า ${f}`); }
});

/* ---- boot ---- */
function normalise(s){
  const d = defaultState();
  const out = Object.assign({}, d, s || {});
  out.settings = Object.assign({}, d.settings, (s||{}).settings || {});
  if (!out.settings.sections || !out.settings.sections.length) out.settings.sections = d.settings.sections;
  ['logs','makeups','cuts'].forEach(k => { out[k] = out[k] || {}; });
  return out;
}
try { const ls = localStorage.getItem('mtt-state'); if (ls) state = normalise(JSON.parse(ls)); } catch(e){}
render();

(async () => {
  if (!window.claude || !window.claude.use){ setSave('บันทึกในเบราว์เซอร์นี้'); return; }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (user){ const can = await user.can('data.write'); if (can === false) { canWrite = false; render(); } }
  if (!db){ setSave('บันทึกในเบราว์เซอร์นี้'); return; }
  dbApi = db; dbRef = db.doc('tracker/state');
  setSave('กำลังโหลด...');
  const timer = setTimeout(() => setSave('ยังเชื่อมต่อข้อมูลไม่ได้ ข้อมูลอาจไม่เป็นปัจจุบัน'), 10000);
  dbRef.onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    if (snap.metadata.hasPendingWrites) return;
    if (snap.exists && !saveTimer && !saving){
      const js = JSON.stringify(snap.data());
      if (js !== lastSaved){ state = normalise(JSON.parse(js)); lastSaved = js; render(); }
    }
    if (!snap.metadata.fromCache) setSave(canWrite ? 'บันทึกแล้ว' : 'ดูได้อย่างเดียว');
  }, err => { clearTimeout(timer); setSave('โหลดข้อมูลไม่ได้'); });
})();
</script>
